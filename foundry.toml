[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
remappings = [
  "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
  "forge-std/=lib/forge-std/src/"
]

[lint]
lint_on_build = false

[rpc_endpoints]
creditcoin_usc = "${CREDITCOIN_RPC_URL}"
source = "${SOURCE_CHAIN_RPC_URL}"

